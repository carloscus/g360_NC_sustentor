[project]
name = "g360-erp-nc-sustentor"
version = "1.2.0"
description = "G360 ERP NC Sustentor - Automatización de cuadros de sustento de Notas de Crédito (NC) y análisis CRM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet[desktop]==0.28.3",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "python-dotenv==1.2.2",
    "xlrd==2.0.1",
    "pyarrow==17.0.0",
    "uv>=0.6.2",
    "matplotlib>=3.8.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
